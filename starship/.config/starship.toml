#  Starship — Monokai Boosted powerline
#  Palette matches ~/.config/kitty/kitty-themes/themes/Monokai_Boosted.conf
#  Two lines: context bar on top, prompt character below.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
[](fg:#ff6ac1)\
$os\
$username\
[](fg:#ff6ac1 bg:#ae81ff)\
$directory\
[](fg:#ae81ff bg:#a6f024)\
$git_branch\
$git_status\
$git_state\
[](fg:#a6f024 bg:#48b8ff)\
$nodejs\
$python\
$rust\
$golang\
$java\
$php\
$docker_context\
$package\
[](fg:#48b8ff bg:#ffa41f)\
$cmd_duration\
[](fg:#ffa41f)\
$fill\
$jobs\
$env_var\
$time\
$line_break\
$character"""

right_format = """$status"""

[fill]
symbol = ' '

# ── context ──────────────────────────────────────────────────
[os]
disabled = false
style = "bg:#ff6ac1 fg:#16161a bold"
format = '[ $symbol]($style)'

[os.symbols]
EndeavourOS = ""
Arch = ""
Linux = ""

[username]
show_always = true
style_user = "bg:#ff6ac1 fg:#16161a bold"
style_root = "bg:#ff2d6f fg:#fdfdf0 bold"
format = '[ $user ]($style)'

[hostname]
ssh_only = true
style = "bg:#ff6ac1 fg:#16161a bold"
format = '[@$hostname ]($style)'

# ── directory ────────────────────────────────────────────────
[directory]
style = "bg:#ae81ff fg:#16161a bold"
format = '[ $path ]($style)[$read_only]($read_only_style)'
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " "
read_only_style = "bg:#ae81ff fg:#ff2d6f"
home_symbol = " "

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "
"Desktop" = " "
".config" = " "

# ── git ──────────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "bg:#a6f024 fg:#16161a bold"
format = '[ $symbol $branch ]($style)'
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bg:#a6f024 fg:#16161a bold"
format = '[$all_status$ahead_behind]($style)'
conflicted = ' ${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
up_to_date = ''
untracked = '?${count} '
stashed = ' ${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '

[git_state]
style = "bg:#a6f024 fg:#ff2d6f bold"
format = '[\($state( $progress_current/$progress_total)\) ]($style)'

# ── languages / runtimes ─────────────────────────────────────
[nodejs]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version ]($style)'

[python]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version( \($virtualenv\)) ]($style)'

[rust]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version ]($style)'

[java]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version ]($style)'

[php]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version ]($style)'

[docker_context]
symbol = ""
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $context ]($style)'
only_with_files = true

[package]
symbol = "󰏗"
style = "bg:#48b8ff fg:#16161a bold"
format = '[ $symbol $version ]($style)'
display_private = false

# ── timing ───────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "bg:#ffa41f fg:#16161a bold"
format = '[  $duration ]($style)'
show_milliseconds = false

# ── right side of the top line ───────────────────────────────
[jobs]
symbol = ""
style = "fg:#ffdc3d bold"
format = '[ $symbol$number]($style)'
number_threshold = 1

# Shows up when the shell is running inside Claude Code
[env_var.CLAUDECODE]
variable = "CLAUDECODE"
default = ""
style = "fg:#ff6ac1 bold"
format = '[  claude]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#6f6b57"
format = '[  $time ]($style)'

# ── prompt character ─────────────────────────────────────────
[character]
success_symbol = "[❯](bold #a6f024)"
error_symbol = "[❯](bold #ff2d6f)"
vimcmd_symbol = "[❮](bold #ae81ff)"
vimcmd_replace_symbol = "[❮](bold #ffa41f)"
vimcmd_visual_symbol = "[❮](bold #ffdc3d)"

[status]
disabled = false
style = "fg:#ff2d6f bold"
symbol = "✘ "
not_found_symbol = "󰍉 "
not_executable_symbol = " "
sigint_symbol = " "
signal_symbol = "⚡ "
format = '[$symbol$status]($style)'
map_symbol = true
pipestatus = true

# ── quieter modules ──────────────────────────────────────────
[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 25
style = "fg:#ff2d6f bold"

[aws]
disabled = true

[gcloud]
disabled = true
