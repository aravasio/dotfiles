# i3blocks config (trimmed to core system status + controls)

# Global properties
separator=true
markup=pango
separator_block_width=28

# Focused window title (click to copy)
[window_title]
command=~/.config/i3/scripts/window_title
interval=1
color=#ffdc3d

# Storage
[disk]
label= 
instance=/
command=~/.config/i3/scripts/disk || printf "DISK --\nDISK --\n#a6a696\n"
interval=30
color=#ffa41f

[disk2]
label=2 
command=~/.config/i3/scripts/disk_secondary || printf "2 --\n2 --\n#a6a696\n"
interval=30
color=#ffa41f

# CPU usage + temp
[cpu_usage]
label=󰍛 
command=CPU_SAMPLE_SEC=0.03 OK_COLOR=#48b8ff ~/.config/i3/scripts/cpu_block
interval=2

[memory]
label= 
command=~/.config/i3/scripts/ram_block
interval=2

[gpu_usage]
label=󰢮 
command=OK_COLOR=#46d9f0 ~/.config/i3/scripts/gpu_block
interval=3

[fps]
label=FPS 
command=~/.config/i3/scripts/fps
interval=1
color=#c7ff4d

# Network in/out
[bandwidth]
label= 
command=UNIT=Mbit ~/.config/i3/scripts/bandwidth2
interval=persist
color=#a6f024

# Volume control
[volume]
command=~/.config/i3/scripts/volume
interval=2

# Mouse sensitivity control (X11/libinput via xinput):
# - Left click opens slider; wheel adjusts by STEP in script.
# - Script applies value to all detected pointer devices and logs failures to:
#   ~/.cache/i3-mouse-sensitivity.log
# - If session is Wayland or no compatible device is found, block shows "wayland"/"n/a".
[mouse_sensitivity]
command=~/.config/i3/scripts/mouse_sensitivity
interval=once

# Date/time
[time]
command=~/.config/i3/scripts/time_block
interval=1
color=#fdfdf0

# AIuda team cheat sheet (click for model recommendations)
[aiuda_team]
command=~/.config/i3/scripts/aiuda-team
interval=once
# Power menu
[shutdown_menu]
full_text= 
command=~/.config/i3/scripts/powermenu
color=#ff2d6f
