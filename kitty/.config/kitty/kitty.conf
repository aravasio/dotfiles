# ═══════════════════════════════════════════════════════════════
#  kitty — sleek build for i3 + picom (X11)
#  Theme cycling by Codex is preserved; everything below is additive.
# ═══════════════════════════════════════════════════════════════

allow_remote_control yes
listen_on unix:@mykitty

# Load the current theme symlink.
include theme.conf

# Cycle Monokai themes
map ctrl+shift+] launch --type=background kitty-theme-next
map ctrl+shift+[ launch --type=background kitty-theme-prev

# ─────────────────────────────────────────────────────────────
# Fonts
# ─────────────────────────────────────────────────────────────
font_family      family="JetBrainsMono Nerd Font" style=Regular
bold_font        family="JetBrainsMono Nerd Font" style=Bold
italic_font      family="JetBrainsMono Nerd Font" style=Italic
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"

font_size 12.0
modify_font cell_height 115%
modify_font underline_position 2

# Ligatures on, except under the cursor
disable_ligatures cursor

text_composition_strategy platform
text_fg_override_threshold 3
undercurl_style thin-sparse

# ─────────────────────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ─────────────────────────────────────────────────────────────
# Window & background
#   NOTE: blur is done by picom on X11 (kitty's background_blur is
#   Wayland-only). See ~/.config/picom/picom.conf.
# ─────────────────────────────────────────────────────────────
background_opacity 0.92
dynamic_background_opacity yes

window_padding_width 10 12
placement_strategy center
confirm_os_window_close 1
remember_window_size no
initial_window_width 120c
initial_window_height 34c

inactive_text_alpha 0.85
window_border_width 1.5pt
draw_minimal_borders yes

enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid

# ─────────────────────────────────────────────────────────────
# Tab bar
# ─────────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}  {title[:24]}{' ' if layout_name == 'stack' else ''}"
active_tab_font_style bold
tab_activity_symbol " "
bell_on_tab " "

# ─────────────────────────────────────────────────────────────
# Shell integration & command notifications
#   Long command in an unfocused window -> desktop notification.
# ─────────────────────────────────────────────────────────────
shell_integration enabled
notify_on_cmd_finish unfocused 15.0
allow_hyperlinks yes

# ─────────────────────────────────────────────────────────────
# Scrollback & mouse
# ─────────────────────────────────────────────────────────────
scrollback_lines 50000
scrollback_pager_history_size 128
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier 3.0

mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover

# ─────────────────────────────────────────────────────────────
# Bell
# ─────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.1 linear
visual_bell_color #ff6ac1
window_alert_on_bell yes

# ─────────────────────────────────────────────────────────────
# Performance
# ─────────────────────────────────────────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ═════════════════════════════════════════════════════════════
#  Keybinds
# ═════════════════════════════════════════════════════════════

# Font size
map ctrl+shift+plus       change_font_size all +1.0
map ctrl+shift+minus      change_font_size all -1.0
map ctrl+shift+backspace  change_font_size all 0

# New windows/tabs inherit the current directory
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t     new_tab_with_cwd

# Splits — ctrl+alt keeps zsh's alt+f/alt+d/alt+l word commands intact,
# and i3 owns Mod4, so this range is free.
map ctrl+alt+d launch --location=vsplit --cwd=current
map ctrl+alt+shift+d launch --location=hsplit --cwd=current
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
map ctrl+alt+shift+h move_window left
map ctrl+alt+shift+j move_window down
map ctrl+alt+shift+k move_window up
map ctrl+alt+shift+l move_window right
map ctrl+alt+z toggle_layout stack
map ctrl+alt+f layout_action rotate

# Resize mode: ctrl+alt+r then arrows/hjkl, esc to exit
map ctrl+alt+r kitten resize_window

# Background opacity on the fly
map ctrl+shift+o     set_background_opacity +0.03
map ctrl+shift+i     set_background_opacity -0.03
map ctrl+shift+0     set_background_opacity default

# ── Kittens ──────────────────────────────────────────────────
# Pick any path on screen and open it in nvim at the right line
map ctrl+shift+p>f kitten hints --type=path --program -
map ctrl+shift+p>n kitten hints --type=linenum --linenum-action=window nvim +{line} {path}
map ctrl+shift+p>l kitten hints --type=line --program -
map ctrl+shift+p>w kitten hints --type=word --program -
map ctrl+shift+p>h kitten hints --type=hyperlink
map ctrl+shift+p>y kitten hints --type=hash --program -

# Unicode / emoji picker
map ctrl+shift+u kitten unicode_input

# Scrollback in $PAGER, and clipboard/history helpers
map ctrl+shift+g show_last_command_output
map ctrl+shift+e open_url_with_hints

# Reload config (kitty default is also ctrl+shift+f5)
map f5 load_config_file
