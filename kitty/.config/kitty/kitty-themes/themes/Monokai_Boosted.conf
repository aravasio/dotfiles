# Monokai Boosted — saturated Monokai for kitty
# Based on Monokai Soda, with: deeper background, higher-contrast foreground,
# and de-duplicated ANSI slots (Soda maps magenta==red and bright==normal for
# several colors, which flattens TUI output like Claude Code).

background            #16161a
foreground            #d8d8c8
selection_background  #3d3f3a
selection_foreground  #fdfdf0

cursor                #ff6ac1
cursor_text_color     #16161a

# black
color0  #232526
color8  #6f6b57
# red
color1  #ff2d6f
color9  #ff5c8a
# green
color2  #a6f024
color10 #c7ff4d
# yellow / orange
color3  #ffa41f
color11 #ffdc3d
# blue (Soda used purple here; a true blue separates links/info from keywords)
color4  #48b8ff
color12 #7ad4ff
# magenta / purple
color5  #ae81ff
color13 #ff79d2
# cyan
color6  #46d9f0
color14 #86f4ff
# white
color7  #d8d8c8
color15 #fdfdf0

# UI chrome
url_color             #46d9f0
active_border_color   #ff6ac1
inactive_border_color #3d3f3a
bell_border_color     #ffa41f

active_tab_foreground   #16161a
active_tab_background   #ff6ac1
inactive_tab_foreground #a6a696
inactive_tab_background #232526

mark1_foreground #16161a
mark1_background #a6f024
mark2_foreground #16161a
mark2_background #ff79d2
mark3_foreground #16161a
mark3_background #48b8ff
