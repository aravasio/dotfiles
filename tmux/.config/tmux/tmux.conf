# ═══════════════════════════════════════════════════════════════
#  tmux — Monokai Boosted, matched to kitty
#  Prefix stays C-b. To switch to C-a, uncomment the block below.
# ═══════════════════════════════════════════════════════════════
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── terminal / colors ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"
set -ga terminal-features ",xterm-kitty:usstyle,*:RGB"
set -g allow-passthrough on        # let kitty graphics through
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-position top
set -g set-titles on
set -g set-titles-string "#S · #W"

# ── palette ──────────────────────────────────────────────────
%hidden BG="#16161a"
%hidden FG="#d8d8c8"
%hidden PINK="#ff6ac1"
%hidden PURPLE="#ae81ff"
%hidden GREEN="#a6f024"
%hidden BLUE="#48b8ff"
%hidden CYAN="#46d9f0"
%hidden YELLOW="#ffdc3d"
%hidden GREY="#6f6b57"
%hidden PANEL="#232526"

# ── status bar ───────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#{FG}"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#{BG},bg=#{PINK},bold]  #S #[fg=#{PINK},bg=default,nobold]"
set -g status-right "#[fg=#{PURPLE}]#[fg=#{BG},bg=#{PURPLE},bold] #{?client_prefix,󰌌 PREFIX ,󰆍 #{pane_current_command} }#[fg=#{BLUE},bg=#{PURPLE}]#[fg=#{BG},bg=#{BLUE},bold] 󰃰 %H:%M #[fg=#{GREEN},bg=#{BLUE}]#[fg=#{BG},bg=#{GREEN},bold]  #h "

setw -g window-status-format "#[fg=#{GREY}] #I #[fg=#{FG}]#W "
setw -g window-status-current-format "#[fg=#{YELLOW},bg=#{PANEL}] #[fg=#{YELLOW},bg=#{PANEL},bold]#I #[fg=#{FG},bg=#{PANEL}]#W #[fg=#{PANEL},bg=default]"
setw -g window-status-activity-style "fg=#{PINK},blink"
setw -g window-status-separator ""

# ── panes ────────────────────────────────────────────────────
set -g pane-border-style "fg=#3d3f3a"
set -g pane-active-border-style "fg=#{PINK}"
set -g pane-border-lines heavy
set -g pane-border-status off
set -g display-panes-colour "#3d3f3a"
set -g display-panes-active-colour "#{PINK}"

# ── messages / copy mode ─────────────────────────────────────
set -g message-style "bg=#{PINK},fg=#{BG},bold"
set -g message-command-style "bg=#{PURPLE},fg=#{BG},bold"
setw -g mode-style "bg=#{PURPLE},fg=#{BG},bold"
set -g clock-mode-colour "#{PINK}"

# ── keybinds ─────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
