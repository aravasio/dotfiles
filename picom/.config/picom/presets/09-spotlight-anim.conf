# ══════════════════════════════════════════════════════════════
#  picom preset: Spotlight ANIM (A/B test)
#  08 + animations engine. TEST ONLY: activate after pacman -Syu (picom v13+nvidia 610+kernel 7.x).
#
#  Switch with:  picom-preset 08-spotlight      (or $mod+Shift+]/[ to cycle)
#  This is a complete standalone config — edit freely, nothing regenerates it.
# ══════════════════════════════════════════════════════════════

backend = "glx";
vsync = true;
use-damage = true;

blur: {
  method = "dual_kawase";
  strength = 10;
  background = false;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "_GTK_FRAME_EXTENTS@"
];

corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'",
  "class_g = 'i3-frame'"
];

shadow = true;
shadow-radius = 26;
shadow-opacity = 0.6;
shadow-offset-x = -24;
shadow-offset-y = -24;
shadow-color = "#ff6ac1";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'",
  "class_g = 'i3-frame'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@"
];

inactive-opacity = 0.78;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.28;

opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'mpv'",
  "100:fullscreen"
];

focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g = 'YouTube'",
  "fullscreen"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
fade-exclude = [ "class_g = 'Dunst'" ];

animations = (
  # window opens: scale up with a fade
  {
    triggers = [ "open" ];
    opacity = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.28; start = 0; end = 1; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.34, 1.55, 0.64, 1)"; duration = 0.36; start = 0.86; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
  },

  # window closes
  {
    triggers = [ "close" ];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = 1; end = 0.86; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
  },

  # workspace switch (i3 unmaps/maps windows -> show/hide)
  {
    triggers = [ "show" ];
    opacity = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.3; start = 0; end = 1; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-y = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.34; start = 60; end = 0; };
    shadow-offset-y = "offset-y";
  },
  {
    triggers = [ "hide" ];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = 1; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-y = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = 0; end = -48; };
    shadow-offset-y = "offset-y";
  },

  # focus changes
  {
    triggers = [ "increase-opacity", "decrease-opacity" ];
    opacity = { curve = "cubic-bezier(0.4, 0, 0.2, 1)"; duration = 0.24;
                start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
    blur-opacity = 1;
    shadow-opacity = "opacity";
  },

  # layout changes: glide from the old rect to the new one
  {
    triggers = [ "geometry" ];
    scale-x = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.26; start = "window-width-before / window-width"; end = 1; };
    scale-y = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.26; start = "window-height-before / window-height"; end = 1; };
    offset-x = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.26; start = "window-x-before - window-x"; end = 0; };
    offset-y = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.26; start = "window-y-before - window-y"; end = 0; };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    saved-image-blend = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.26; start = 1; end = 0; };
  }
);

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;
