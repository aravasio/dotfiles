# ══════════════════════════════════════════════════════════════
#  picom preset: Bouncy
#  Toy-like round corners (was the animation showcase; stripped in the freeze purge).
#
#  Switch with:  picom-preset 05-bouncy      (or $mod+Shift+]/[ to cycle)
#  This is a complete standalone config — edit freely, nothing regenerates it.
# ══════════════════════════════════════════════════════════════

backend = "glx";
vsync = true;
use-damage = true;

blur: {
  method = "dual_kawase";
  strength = 5;
  background = false;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "_GTK_FRAME_EXTENTS@"
];

corner-radius = 18;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'",
  "class_g = 'i3-frame'"
];

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.5;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-color = "#a6f024";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'",
  "class_g = 'i3-frame'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@"
];

inactive-opacity = 0.9;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.05;

opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'mpv'",
  "100:fullscreen"
];

focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "fullscreen"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
fade-exclude = [ "class_g = 'Dunst'" ];

# animations: stripped 2026-07-26 (freeze culprit confirmed - see
# ~/.config/theme-forge/STATUS.md; originals in presets-animated-backup-*.tgz)

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;
